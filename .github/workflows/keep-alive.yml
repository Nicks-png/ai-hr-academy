name: Keep Render server awake

on:
  schedule:
    # A cada 10 min — Render Free dorme após ~15 min sem tráfego
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/status
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://ai-hr-academy.onrender.com/api/status)
            echo "tentativa $i: HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 5
          done
          echo "Servidor não respondeu 200 após 3 tentativas."
          exit 1
