<!DOCTYPE html>
<html><head><meta charset="UTF-8"/>
<script>
  try {
    const auth = JSON.parse(localStorage.getItem('aihr_auth') || 'null')
    if (auth && auth.token) window.location.replace('/intranet.html')
    else window.location.replace('/login.html')
  } catch { window.location.replace('/login.html') }
</script>
</head><body></body></html>
