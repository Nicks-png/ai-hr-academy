<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seleção de Candidatos - AI-HR Academy</title>
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/selecao.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><img src="/img/logo.png" alt="AI-HR Academy"> Seleção de Candidatos</h1>
            <nav>
                <a href="/" class="btn">Início</a>
                <a href="/triagem.html" class="btn">Triagem</a>
                <a href="/selecao.html" class="btn active">Seleção</a>
                <a href="/whatsapp.html" class="btn">WhatsApp</a>
            </nav>
        </header>

        <main>
            <section id="candidate-list">
                <h2>Candidatos Triados <span id="candidate-count"></span></h2>
                <div id="filters">
                    <select id="vaga-filter">
                        <option value="">Todas as Vagas</option>
                    </select>
                    <select id="sort-select">
                        <option value="">Ordenar por...</option>
                        <option value="score-desc">Maior compatibilidade</option>
                        <option value="score-asc">Menor compatibilidade</option>
                        <option value="name-asc">Nome (A–Z)</option>
                    </select>
                    <input type="text" id="search-input" placeholder="Buscar por nome ou habilidade...">
                    <label style="display:flex;align-items:center;gap:6px;font-size:.85rem;cursor:pointer">
                        <input type="checkbox" id="select-all-check"> Selecionar todos
                    </label>
                </div>
                <div id="candidates-container">
                    <!-- Candidatos serão carregados aqui -->
                    <p class="loading">Carregando candidatos...</p>
                </div>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 AI-HR Academy. Todos os direitos reservados.</p>
        </footer>
    </div>

    <script src="/js/selecao.js"></script>
</body>
</html>
