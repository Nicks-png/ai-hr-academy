<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Run & Bass Club (@runebass_)</title>
    <style>
        /* CSS RESET & IDENTIDADE VISUAL */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #fafafa;
            margin: 0;
            color: #262626;
        }

        .container {
            max-width: 935px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        /* HEADER SECTION */
        header {
            display: flex;
            margin-bottom: 44px;
            align-items: center;
        }

        .profile-pic-container {
            flex-basis: 30%;
            display: flex;
            justify-content: center;
            margin-right: 30px;
        }

        .profile-pic {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 1px solid #dbdbdb;
            padding: 4px;
            object-fit: cover;
        }

        .profile-info {
            flex-basis: 70%;
        }

        .username-row {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .username {
            font-size: 28px;
            font-weight: 300;
            margin-right: 20px;
        }

        .stats-row {
            display: flex;
            margin-bottom: 20px;
            list-style: none;
            padding: 0;
        }

        .stats-row li {
            margin-right: 40px;
            font-size: 16px;
        }

        .stats-row span {
            font-weight: 600;
        }

        .bio-title {
            font-weight: 600;
            display: block;
        }

        .bio-link {
            color: #00376b;
            text-decoration: none;
            font-weight: 600;
        }

        /* GRID SECTION */
        .tabs {
            border-top: 1px solid #dbdbdb;
            display: flex;
            justify-content: center;
            gap: 60px;
            margin-bottom: 0;
        }

        .tab-item {
            height: 52px;
            display: flex;
            align-items: center;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #8e8e8e;
            border-top: 1px solid transparent;
            cursor: pointer;
        }

        .tab-item.active {
            color: #262626;
            border-top: 1px solid #262626;
            margin-top: -1px;
        }

        .photo-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 28px;
            margin-top: 20px;
        }

        .photo-item {
            position: relative;
            aspect-ratio: 1 / 1;
            background-color: #efefef;
            overflow: hidden;
        }

        .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: filter 0.3s;
        }

        .photo-item:hover img {
            filter: brightness(0.8);
        }

        /* MOBILE RESPONSIVE */
        @media (max-width: 735px) {
            header { margin-bottom: 20px; }
            .profile-pic { width: 77px; height: 77px; }
            .stats-row { justify-content: space-around; border-top: 1px solid #dbdbdb; padding: 10px 0; }
            .photo-grid { gap: 3px; }
            .username { font-size: 20px; }
            .profile-pic-container { margin-right: 15px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="profile-pic-container">
                <img src="https://instagram.fcgh37-1.fna.fbcdn.net/v/t51.2885-19/488624007_1321265305829535_5384671118163539849_n.jpg?stp=dst-jpg_s150x150_tt6&_nc_cat=103&oh=00_Afyb5VHYrvEST8dnRAmYcjt-gkryTReIYqvK19Gl950xJg&oe=69D0001A" alt="Run & Bass" class="profile-pic">
            </div>
            
            <div class="profile-info">
                <div class="username-row">
                    <span class="username">runebass_</span>
                    <svg aria-label="Verificado" fill="#0095f6" height="18" viewBox="0 0 40 40" width="18"><path d="M19.998 3.094 14.638 0l-2.972 5.15H5.432v6.354L0 14.64 3.094 20 0 25.359l5.432 3.137v5.905h5.975L14.638 40l5.36-3.094L25.358 40l3.232-5.6h6.162v-6.01L40 25.359 36.905 20 40 14.641l-5.248-3.03v-6.46h-6.419L25.358 0l-5.36 3.094Zm7.415 11.225 2.254 2.287-11.43 11.5-6.835-6.93 2.244-2.258 4.587 4.581 9.18-9.18Z"></path></svg>
                </div>
                
                <ul class="stats-row">
                    <li><span>73</span> posts</li>
                    <li><span>57,8 mil</span> seguidores</li>
                    <li><span>81</span> seguindo</li>
                </ul>

                <div class="bio">
                    <span class="bio-title">Run & Bass Club</span>
                    <span>Comunidade<br>Run the Beat, Feel the Bass!<br>Powered by @growthsupplements<br>Support by @redbullbr</span>
                    <br>
                    <a href="#" class="bio-link">linktr.ee/runebass_</a>
                </div>
            </div>
        </header>

        <div class="tabs">
            <div class="tab-item active">POSTS</div>
            <div class="tab-item">REELS</div>
            <div class="tab-item">MARCADOS</div>
        </div>

        <div class="photo-grid">
            <div class="photo-item"><img src="https://instagram.fcgh37-1.fna.fbcdn.net/v/t51.82787-15/568717930_17885201127390860_4362604961033049162_n.jpg?stp=dst-jpg_e35_tt6&_nc_cat=111&oh=00_AfzBY9aRSt_XuLCqSmJYXwKkp_eBpJx_orZiKZSa7I8FOA&oe=69CFCEC0"></div>
            <div class="photo-item"><img src="https://instagram.fcgh37-1.fna.fbcdn.net/v/t51.75761-15/491463074_17862595413390860_4459646712252091084_n.jpg?stp=dst-jpg_e35_tt6&_nc_cat=101&oh=00_Afy9tZw1E-OIiPhX4-Gvxf46YNKLoG4bNPzeB7xK7ZPj5w&oe=69CFDBA1"></div>
            <div class="photo-item"><img src="https://instagram.fcgh11-1.fna.fbcdn.net/v/t51.82787-15/658529732_17905178817390860_6068236487669083110_n.jpg?stp=dst-jpg_e15_tt6&_nc_cat=108&oh=00_AfxjZW3YiREKs0eUFR8h6z8Okjl-DN3173utHNMU1czN-w&oe=69CFEF19"></div>
            </div>
    </div>

</body>
</html>
